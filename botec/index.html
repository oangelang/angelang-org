      <p style="margin:0 0 4px">${f.claim}</p>
      <div class="given"><b>One input below is wrong or does not fit.</b> Tap the one you would check first. Inputs marked assumption are fine for this exercise.</div>
      <div id="fins">${f.inputs.map((x, i) => `<button type="button" class="fin" data-i="${i}"><span>${x.l}</span><b>${x.d}</b></button>`).join("")}</div>
      <div class="kv" style="margin-top:14px"><span class="k">Claimed result</span><span class="v">${resText(f, f.calc(vals))}</span></div>
      <div id="step2" hidden>
        <p style="margin:12px 0 0;font-weight:700">If that input is wrong, how far off is the claimed result?</p>
        <div class="fchoices">${FCH.map((c, i) => `<button type="button" data-f="${i}">${c[1]}</button>`).join("")}</div>
      </div>
    </div>`;
  app.querySelectorAll(".fin").forEach(b => b.addEventListener("click", () => {
    state.pick = parseInt(b.dataset.i, 10);
    app.querySelectorAll(".fin").forEach(x => x.classList.toggle("sel", x === b));
    document.getElementById("step2").hidden = false;
  }));
  app.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => submitFlaw(FCH[parseInt(b.dataset.f, 10)])));
}
function submitFlaw(choice) {
  const f = state.deck[state.i];
  const ok = state.pick === f.flaw;
  const vals = f.inputs.map(x => x.v), fixed = vals.slice();
  fixed[f.flaw] = f.fixV;
  const rO = f.calc(vals), rF = f.calc(fixed);
  const tf = Math.max(rO / rF, rF / rO);
  let pts = 0, fpts = 0;
  if (ok) { const err = Math.abs(Math.log10(choice[0] / tf)); fpts = err <= 0.2 ? 40 : err <= 0.45 ? 25 : err <= 0.8 ? 10 : 0; pts = 60 + fpts; }
  const t = flawStats.types[f.type] || { n: 0, found: 0 };
  t.n++; if (ok) t.found++; flawStats.types[f.type] = t;
  flawStats.n++; if (ok) { flawStats.found++; flawStats.done[f.id] = true; }
  saveFlaw();
  state.total += pts;
  state.results.push({ q: f.title, pts: pts, ok: ok });
  state.phase = "result";
  renderFlawResult(f, ok, choice, rO, rF, tf, pts, fpts);
}
function renderFlawResult(f, ok, choice, rO, rF, tf, pts, fpts) {
  const last = state.i === state.deck.length - 1;
  const fmtF = x => x < 10 ? x.toFixed(1) + "x" : Math.round(x).toLocaleString("en-US") + "x";
  app.innerHTML = `
    ${topbar()}
    <div class="card">
      <div class="verdict display ${ok ? "good" : "bad"}">${ok ? "Found it" : "Not that one"}</div>
      <div class="pts">+${pts} points${ok ? " (60 for the flaw, " + fpts + " for the size)" : ""}</div>
      <div class="q display" style="font-size:20px">${f.title}</div>
      <div id="fins">${f.inputs.map((x, i) => `<div class="fin ${i === f.flaw ? "flaw" : ""} ${i === state.pick && i !== f.flaw ? "sel" : ""}"><span>${x.l}${i === f.flaw ? '<small>Flawed. Sources say ' + f.fixD + '</small>' : (i === state.pick ? '<small>You picked this one. It is fine.</small>' : '')}</span><b>${i === f.flaw ? '<s>' + x.d + '</s>' : x.d}</b></div>`).join("")}</div>
      <div class="kv" style="margin-top:14px">
        <span class="k">Claimed result</span><span class="v y">${resText(f, rO)}</span>
        <span class="k">Corrected result</span><span class="v t">${resText(f, rF)}</span>
        <span class="k">Off by</span><span class="v">${fmtF(tf)}</span>
        ${ok ? '<span class="k">Your guess</span><span class="v">' + choice[1] + '</span>' : ''}
        <span class="k">Type of flaw</span><span class="v">${f.type}</span>
      </div>
      <div class="why">${f.why}${srcHtml(f)}<small>Assumptions are marked in the inputs. Figures are rounded and publishers revise them.</small></div>
      <div class="row"><button id="next" type="button" class="primary">${last ? "See results" : "Next scenario"}</button></div>
    </div>`;
  const nb = document.getElementById("next");
  nb.focus({ preventScroll: true });
  nb.addEventListener("click", () => { if (last) renderFlawEnd(); else { state.i++; renderFlaw(); } });
}
function renderFlawEnd() {
  const n = state.results.length, found = state.results.filter(r => r.ok).length;
  app.innerHTML = `
    <div class="card">
      <div class="pts" style="margin:0">Find the flaw round done</div>
      <div class="big display">${state.total}<span style="font-size:22px;color:var(--muted);font-weight:600"> / ${n * 100}</span></div>
      <p style="margin:8px 0 0">You spotted the flawed input in ${found} of ${n}.</p>
      <ul class="hist">${state.results.map(r => `<li><span>${r.q}</span><b class="${r.ok ? "good" : "bad"}">${r.pts}</b></li>`).join("")}</ul>
      <div class="row" style="margin-top:18px"><button id="again" type="button" class="primary">Another round</button><button id="home" type="button">Home</button></div>
    </div>`;
  document.getElementById("again").addEventListener("click", startFlaw);
  document.getElementById("home").addEventListener("click", renderIntro);
}

/* ---------- Starter round and primer ---------- */
const STARTER_KEYS = ["seconds are in a year", "heart beat in an 80 year", "liters of water does one person drink", "working hours are there", "gas stations", "combined weight of every human", "total land area", "How far away is the Moon", "babies are born", "many people use the internet"];
function isStarter(q) { return !q.lo && STARTER_KEYS.some(k => q.q.indexOf(k) >= 0); }
function startStarter() {
  const deck = shuffle(QUESTIONS.filter(q => isStarter(q) && !mastered.has(q.id))).slice(0, 5);
  if (!deck.length) return;
  state = { mode: "std", deck: deck, i: 0, total: 0, results: [], phase: "ask", hint: false, cleared: 0 };
  renderQuestion();
}
function renderPrimer(first) {
  try { localStorage.setItem("botec-primer", "1"); } catch (e) {}
  const starters = QUESTIONS.filter(q => isStarter(q) && !mastered.has(q.id));
  app.innerHTML = `
    <div class="card about">
      <h1 class="display" style="font-size:30px;line-height:1.05;font-weight:800;">How this works</h1>
      <p>A back-of-the-envelope estimate (BOTEC) means getting a number that is roughly right, fast, without looking anything up. You do it by splitting a hard question into pieces you can guess.</p>

      <h2>One question, start to finish</h2>
      <div class="given"><b>How many gas stations are in the United States?</b></div>
      <ol class="steps">
        <li><b>Gut guess.</b> Say a number before any math. Maybe 50,000? Write it down.</li>
        <li><b>Split it.</b> Gas stations serve people. About 340 million people live in the US. How many people does one station serve? Maybe 2,000.</li>
        <li><b>Do the math.</b> 340 million \u00f7 2,000 = 170,000.</li>
        <li><b>Check it.</b> The real answer is about 145,000. You are off by 1.2x. Your gut guess was off by 3x, so splitting helped.</li>
      </ol>

      <h2>How the game scores you</h2>
      <ul>
        <li>You are judged by how many times too high or too low you were, not by the raw gap. 1.2x off is excellent. 2x off still clears the question for good. 10x off means a wrong order of magnitude.</li>
        <li>Type math straight into the box, like <b>340 million / 2000</b>. The keypad has k, M and B for thousands, millions and billions.</li>
        <li>Questions you miss come back sooner. A hint costs 25 percent of the points.</li>
        <li>The optional 80% range asks for a low and a high you are 80 percent sure the answer falls between. It trains you to know how unsure you are. Missing about 2 in 10 is the goal, not 0.</li>
      </ul>

      <h2>Start easy</h2>
      <p>The starter round uses ${starters.length ? "easy questions built from numbers most people can reason about" : "easy questions"}, such as seconds in a year, heartbeats in a lifetime and gas stations. Move on to the other topics when you feel warmed up.</p>

      <div class="row" style="margin-top:18px">
        ${starters.length ? '<button id="pStart" type="button" class="primary">Start the starter round</button>' : ""}
        <button id="pHome" type="button"${starters.length ? "" : ' class="primary"'}>${first ? "Skip to the home screen" : "Back"}</button>
      </div>
    </div>`;
  const s = document.getElementById("pStart");
  if (s) s.addEventListener("click", startStarter);
  document.getElementById("pHome").addEventListener("click", renderIntro);
}
let seenPrimer = false;
try { seenPrimer = !!localStorage.getItem("botec-primer"); } catch (e) {}

if (!seenPrimer && !mastered.size && !Object.keys(seen).length) renderPrimer(true); else renderIntro();
</script>
</body>
