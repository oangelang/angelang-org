<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="BOTEC Gauntlet: practice back-of-the-envelope estimation on global development, health, climate and AI numbers.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOTEC Gauntlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e9eef4;
  --grid: #d3dce7;
  --surface: #ffffff;
  --ink: #0e1a2b;
  --muted: #55657a;
  --line: #c5d0dd;
  --you: #1d4ed8;
  --truth: #d9480f;
  --good: #0f7a4a;
  --mid: #a15c00;
  --bad: #b42318;
  --btn: #0e1a2b;
  --btn-ink: #ffffff;
  --soft: #f3f6fa;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1320;
    --grid: #15213a;
    --surface: #111c2e;
    --ink: #e8eef7;
    --muted: #93a4bc;
    --line: #26354f;
    --you: #7aa2ff;
    --truth: #ff8a4c;
    --good: #4ade9a;
    --mid: #f5b84a;
    --bad: #ff7a70;
    --btn: #e8eef7;
    --btn-ink: #0b1320;
    --soft: #0e1727;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1320;
  --grid: #15213a;
  --surface: #111c2e;
  --ink: #e8eef7;
  --muted: #93a4bc;
  --line: #26354f;
  --you: #7aa2ff;
  --truth: #ff8a4c;
  --good: #4ade9a;
  --mid: #f5b84a;
  --bad: #ff7a70;
  --btn: #e8eef7;
  --btn-ink: #0b1320;
  --soft: #0e1727;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  min-height: 100%;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
.display { font-family: "Bricolage Grotesque", -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -0.01em; }
h1, h2 { margin: 0; }
.card {
  background: var(--surface);
  border: 1.5px solid var(--ink);
  border-radius: 6px;
  padding: 20px 18px;
  box-shadow: 4px 4px 0 var(--ink);
}
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 14px; color: var(--muted); gap: 10px; }
.topbar strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.homebtn { padding: 4px 12px; font-size: 13px; border-radius: 99px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
.bar > i { display: block; height: 100%; background: var(--ink); transition: width .25s ease; }
.q { font-size: 24px; line-height: 1.2; font-weight: 700; margin: 4px 0 6px; }
.unit { color: var(--muted); font-size: 15px; margin-bottom: 14px; }
label.lab { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
input[type="text"] {
  width: 100%;
  font: inherit;
  font-size: 24px;
  padding: 12px 14px;
  border: 1.5px solid var(--ink);
  border-radius: 6px;
  background: var(--soft);
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
input[type="text"]:focus-visible, button:focus-visible { outline: 3px solid var(--you); outline-offset: 2px; }
.preview { min-height: 58px; margin-top: 10px; padding: 10px 14px; font-size: 26px; font-weight: 800; line-height: 1.2; color: var(--you); border: 1.5px dashed var(--line); border-radius: 6px; background: var(--soft); font-variant-numeric: tabular-nums; word-break: break-word; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
.preview .u { font-size: 14px; font-weight: 500; color: var(--muted); }
.preview.muted { color: var(--muted); font-weight: 500; font-size: 14px; }
.err { color: var(--bad); font-size: 14px; min-height: 20px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
button {
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  border-radius: 6px;
  padding: 12px 18px;
  border: 1.5px solid var(--ink);
  background: var(--surface);
  color: var(--ink);
}
button:disabled { opacity: .55; cursor: default; }
button.primary { background: var(--btn); color: var(--btn-ink); flex: 1; }
button:active { transform: translateY(1px); }
.keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 14px; }
.key { padding: 12px 0; font-size: 20px; background: var(--soft); border-color: var(--line); border-width: 1.5px; }
.key.op { color: var(--you); border-color: var(--you); }
.key.sfx { color: var(--truth); border-color: var(--truth); }
.key.ctl { color: var(--muted); }
.kbtoggle { margin-top: 10px; background: none; border: none; padding: 4px 0; font-size: 13px; color: var(--muted); text-decoration: underline; font-weight: 500; }
.hint {
  margin-top: 14px;
  padding: 12px 14px;
  border-left: 4px solid var(--you);
  background: var(--soft);
  font-size: 15px;
}
.hint[hidden] { display: none; }
.verdict { font-size: 30px; font-weight: 800; line-height: 1.1; margin: 4px 0 4px; }
.pts { font-size: 15px; color: var(--muted); margin-bottom: 18px; }
.cleared { display: inline-block; margin-bottom: 14px; padding: 4px 10px; border-radius: 4px; border: 1.5px solid var(--good); color: var(--good); font-size: 14px; font-weight: 700; }
.nl { position: relative; height: 96px; margin: 8px 6px 14px; }
.nl .axis { position: absolute; left: 0; right: 0; top: 46px; height: 2px; background: var(--ink); }
.nl .tick { position: absolute; top: 40px; width: 1.5px; height: 14px; background: var(--ink); transform: translateX(-50%); }
.nl .tl { position: absolute; top: 58px; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.nl .mk { position: absolute; transform: translateX(-50%); text-align: center; font-size: 12px; font-weight: 700; white-space: nowrap; }
.nl .mk.y { top: 0; color: var(--you); }
.nl .mk.t { top: 74px; color: var(--truth); }
.nl .dot { position: absolute; top: 40px; width: 14px; height: 14px; border-radius: 50%; transform: translateX(-50%); border: 2px solid var(--surface); }
.nl .dot.y { background: var(--you); }
.nl .dot.t { background: var(--truth); }
.nl .stem { position: absolute; width: 1.5px; transform: translateX(-50%); }
.nl .stem.y { top: 16px; height: 26px; background: var(--you); }
.nl .stem.t { top: 54px; height: 20px; background: var(--truth); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; font-size: 16px; margin-bottom: 14px; }
.kv .k { color: var(--muted); }
.kv .v { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.kv .v.y { color: var(--you); }
.kv .v.t { color: var(--truth); }
.why { font-size: 15px; padding-top: 12px; border-top: 1.5px dashed var(--line); margin-top: 6px; }
.why small { display: block; color: var(--muted); margin-top: 6px; font-size: 13px; }
.big { font-size: 56px; font-weight: 800; line-height: 1; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
.stat { border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--soft); }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.hist { list-style: none; padding: 0; margin: 14px 0 0; }
.hist li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.hist li span:first-child { flex: 1; }
.hist li b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.intro p { margin: 10px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { padding: 8px 12px; font-size: 14px; border-radius: 99px; background: var(--surface); }
.chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.chip small { font-weight: 500; opacity: .75; }
.modes { display: grid; gap: 10px; margin-top: 16px; }
.modes button { text-align: left; display: flex; justify-content: space-between; align-items: center; }
.modes button small { font-weight: 500; opacity: .75; }
.rules { font-size: 14px; color: var(--muted); margin-top: 16px; }
.linkbtn { background: none; border: none; padding: 0; font-size: 14px; color: var(--muted); text-decoration: underline; font-weight: 500; margin-top: 10px; }
.given { margin: 0 0 14px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--soft); font-size: 14px; }
.note { margin: 12px 0 0; font-size: 14px; color: var(--muted); }
.steps { margin: 8px 0 10px; padding-left: 20px; font-size: 14px; }
.steps li { margin-bottom: 4px; }
.about h2 { font-size: 15px; margin: 18px 0 6px; }
.about p, .about li { font-size: 15px; margin: 6px 0; }
.about ul { padding-left: 20px; margin: 6px 0; }
.about a { color: var(--you); }
.src { margin-top: 12px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.src b { color: var(--muted); font-weight: 600; }
.src a { color: var(--you); word-break: break-word; }
.src span { color: var(--muted); }
.good { color: var(--good); } .mid { color: var(--mid); } .bad { color: var(--bad); }
.nl .band { position: absolute; top: 42px; height: 10px; background: var(--you); opacity: .22; border-radius: 2px; }
.rangebox { margin-top: 14px; padding: 12px 12px 14px; border: 1.5px dashed var(--line); border-radius: 6px; background: var(--soft); }
.rangebox .rt { font-weight: 700; font-size: 15px; }
.rangebox .rt small { font-weight: 500; color: var(--muted); }
.rangebox .rs { font-size: 13px; color: var(--muted); margin: 2px 0 10px; }
.rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rpv { min-height: 20px; margin-top: 8px; font-size: 14px; color: var(--muted); }
input[type="text"].sm { font-size: 20px; padding: 10px 12px; }
input[type="text"].lbl { font-size: 15px; padding: 9px 12px; border-color: var(--line); background: var(--surface); }
.drow { display: grid; grid-template-columns: 46px 1fr; gap: 8px; margin-top: 10px; align-items: start; }
.dfields { display: grid; gap: 6px; }
.opbtn { padding: 8px 0; font-size: 20px; background: var(--soft); }
.opfix { font-size: 12px; color: var(--muted); padding-top: 12px; text-align: center; }
.cmp { margin: 4px 0 14px; display: grid; gap: 8px; }
.cmprow { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
.cmprow b { font-variant-numeric: tabular-nums; }
.cbar { height: 10px; background: var(--soft); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.cbar i { display: block; height: 100%; }
.trend { position: relative; display: flex; align-items: flex-end; gap: 6px; height: 90px; margin: 22px 0 6px; border-bottom: 1.5px solid var(--ink); }
.trend i { flex: 1; border-radius: 3px 3px 0 0; min-height: 2px; }
.trend .tgt { position: absolute; left: 0; right: 0; bottom: 80%; border-top: 1.5px dashed var(--truth); pointer-events: none; }
.trend .tgt span { position: absolute; right: 0; top: -18px; font-size: 11px; color: var(--truth); }
.brow { padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.brow .top { display: flex; justify-content: space-between; gap: 10px; }
.brow small { color: var(--muted); }
.bias { position: relative; height: 8px; background: var(--soft); border: 1px solid var(--line); border-radius: 4px; margin-top: 8px; }
.bias .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1.5px; background: var(--ink); }
.bias i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.sec { font-size: 17px; margin: 20px 0 4px; }
details.bq { border-top: 1px solid var(--line); padding: 10px 0; font-size: 15px; }
details.bq summary { cursor: pointer; font-weight: 600; }
details.bq summary:focus-visible { outline: 3px solid var(--you); outline-offset: 2px; }
.fin { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; margin-top: 8px; background: var(--surface); font-weight: 600; border-radius: 6px; border: 1.5px solid var(--line); box-sizing: border-box; color: var(--ink); font-size: 15px; }
.fin b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.fin small { display: block; color: var(--muted); font-weight: 500; margin-top: 2px; }
.fin.sel { outline: 3px solid var(--you); outline-offset: 1px; }
.fin.flaw { border-color: var(--truth); }
.fin s { color: var(--truth); }
.fchoices { display: grid; gap: 8px; margin-top: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.prog { height: 8px; background: var(--soft); border: 1px solid var(--line); border-radius: 4px; margin: 8px 0 4px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--good); }
textarea.codebox { width: 100%; box-sizing: border-box; min-height: 96px; font: 12px/1.35 ui-monospace, Menlo, monospace; padding: 10px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--soft); color: var(--ink); margin-top: 10px; word-break: break-all; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const QUESTIONS = [
  /* Everyday */
  { cat: "Everyday", q: "How many seconds are in a year?", unit: "seconds", a: 31536000,
    hint: "60 x 60 x 24 is 86,400 seconds in a day. Multiply by 365.",
    why: "86,400 seconds a day times 365 days is about 31.5 million. A handy shortcut: a year is roughly pi x 10^7 seconds." },
  { cat: "Everyday", q: "How many times does a heart beat in an 80 year life?", unit: "heartbeats", a: 2.9e9,
    hint: "Start with about 70 beats a minute. How many is that per day, then per year?",
    why: "70 per minute is about 100,000 a day, about 37 million a year, and about 2.9 billion over 80 years." },
  { cat: "Everyday", q: "How many rides happen on the NYC subway on a typical weekday?", unit: "rides per weekday", a: 3.7e6,
    hint: "Think about how many people ride, and how many trips each one takes.",
    why: "Weekday ridership runs about 3.5 to 4 million rides. It was over 5 million before 2020 and has not fully recovered." },
  { cat: "Everyday", q: "How many yellow taxi medallions exist in New York City?", unit: "medallions", a: 13500,
    hint: "The number is capped by the city. Think about how many yellow cabs you see on a busy avenue versus the whole city.",
    why: "The cap is about 13,600 medallions. It has barely moved in decades." },
  { cat: "Everyday", q: "How many Starbucks stores are open worldwide?", unit: "stores", a: 40000,
    hint: "The US has the most. China is second. Guess each, then add a long tail for everyone else.",
    why: "Roughly 16,000 in the US, 7,000 or so in China, and the rest spread over about 80 other markets. Total near 40,000." },
  { cat: "Everyday", q: "How many commercial flights take off worldwide in a year?", unit: "flights per year", a: 38e6,
    hint: "Think about the busiest airport's departures per day, then how many airports are anywhere near that busy.",
    why: "That is about 100,000 flights a day, or about 38 million a year, by industry counts. Sources vary on what counts as commercial." },
  { cat: "Everyday", q: "How many gas stations are in the United States?", unit: "stations", a: 145000,
    hint: "Population is about 340 million. How many people would one station serve?",
    why: "One station per 2,300 people or so gives about 145,000. Many are small convenience stores with a few pumps." },
  { cat: "Everyday", q: "What is the combined weight of every human on Earth?", unit: "tonnes", a: 5e8,
    hint: "8 billion people. Do not use adult weight, because children pull the average down.",
    why: "About 60 kg average times 8.2 billion people is roughly 5 x 10^11 kg, which is 500 million tonnes." },
  { cat: "Everyday", q: "How many hours of video are uploaded to YouTube every minute?", unit: "hours per minute", a: 500,
    hint: "Think of how many creators upload in a day. Then convert the days into minutes.",
    why: "YouTube has cited about 500 hours of video per minute. That is 30,000 hours every hour." },
  { cat: "Everyday", q: "How many liters of water does one person drink in a lifetime?", unit: "liters", a: 50000,
    hint: "A couple of liters a day, for about 78 years. Do not count showers or food.",
    why: "About 1.8 liters a day times 365 times 78 years is about 50,000 liters. That is only about 2 percent of one Olympic pool." },

  /* Climate and energy */
  { cat: "AI", q: "How much electricity do the world's data centers use in a year?", unit: "TWh per year", a: 415,
    hint: "World electricity use is about 30,000 TWh a year. What share could servers plausibly take?",
    why: "The IEA put data centers at roughly 415 TWh in 2024, around 1.5 percent of global electricity. AI is pushing it up fast." },
  { cat: "Climate & energy", q: "How much CO2 does burning fossil fuels emit worldwide each year?", unit: "tonnes of CO2 per year", a: 37e9,
    hint: "About 8 billion people. What is the average person's yearly footprint in tonnes?",
    why: "The global average is around 4.6 tonnes per person, times about 8 billion people. That lands near 37 billion tonnes." },
  { cat: "AI", q: "How much power does one Nvidia H100 GPU draw at full load?", unit: "watts", a: 700,
    hint: "Compare to a laptop charger (about 65 W) and a hair dryer (about 1,500 W). Where does a top data center chip sit?",
    why: "The SXM version of the H100 is rated at 700 W. A rack of eight of them draws several kilowatts before cooling." },
  { cat: "Climate & energy", q: "How many people in the world have no access to electricity?", unit: "people", a: 685e6,
    hint: "Sub-Saharan Africa has about 1.2 billion people. Roughly half lack power at home. Add a smaller share of South Asia.",
    why: "The World Bank counted about 685 million in 2022, around 85 percent of them in sub-Saharan Africa. The IEA's count is somewhat higher." },
  { cat: "Climate & energy", q: "How many people cook with wood, charcoal, dung or kerosene instead of clean fuels?", unit: "people", a: 2.1e9,
    hint: "About one person in four on Earth. Think of how many households in South Asia and Africa still cook on open fires.",
    why: "About 2.1 billion people in 2022 (WHO). Some estimates run to 2.3 billion." },
  { cat: "Climate & energy", q: "How many people die each year from household air pollution, mostly from cooking fuels?", unit: "deaths per year", a: 3.2e6,
    hint: "Take the 2.1 billion who cook with dirty fuels. What yearly death rate per 1,000 seems plausible?",
    why: "WHO estimates about 3.2 million deaths a year (2020), including more than 200,000 children under five." },
  { cat: "Climate & energy", q: "How many electric cars were sold worldwide in 2024?", unit: "cars", a: 17e6,
    hint: "Global new car sales are roughly 80 to 90 million a year. What share is plug-in or fully electric?",
    why: "About 17 million (IEA), over 20 percent of new cars. China accounted for roughly 11 million of them." },
  { cat: "Climate & energy", q: "How much solar power capacity is installed worldwide?", unit: "GW", a: 2200,
    hint: "A big nuclear reactor is about 1 GW. China alone added hundreds of GW of solar in a recent year.",
    why: "IRENA reported about 2,250 GW at the end of 2024, roughly double the total just three years earlier." },
  { cat: "Climate & energy", q: "What is the concentration of CO2 in the atmosphere?", unit: "ppm", a: 425,
    hint: "Pre-industrial air was about 280 ppm. It has been climbing roughly 2.5 ppm a year recently.",
    why: "About 425 ppm in 2025, up from 280 before industrialization. The seasonal peak each May is a few ppm higher." },
  { cat: "Climate & energy", q: "How many hectares of tropical primary forest were lost in 2024?", unit: "hectares", a: 6.7e6,
    hint: "A hectare is about two football fields. Think of a country about the size of Panama or Ireland.",
    why: "About 6.7 million hectares (WRI, Global Forest Watch), a record, driven largely by fires. Roughly the area of Panama." },
  { cat: "Climate & energy", q: "How many people were displaced from their homes by disasters in 2023?", unit: "displacements", a: 26e6,
    hint: "Floods, storms, quakes and droughts. Think of the 10 or so worst events and how many people each moves.",
    why: "IDMC counted about 26 million internal displacements by disasters in 2023, mostly weather-related." },
  { cat: "Climate & energy", q: "What share of global CO2 emissions comes from Africa?", unit: "percent", a: 4,
    hint: "Africa has about 18 percent of the world's people. Per person it emits roughly a fifth of the world average.",
    why: "About 4 percent. Africa has roughly 18 percent of the population and very low per-person emissions." },

  /* Health */
  { cat: "Health", q: "How many babies are born worldwide each year?", unit: "births", a: 132e6,
    hint: "8.2 billion people, average lifespan around 72. In a stable population births per year would be population divided by lifespan.",
    why: "8.2 billion divided by 72 years is about 114 million as a floor. Because the population is still growing, the real figure is higher, about 132 million." },
  { cat: "Health", q: "How many children under 5 die each year worldwide?", unit: "deaths per year", a: 4.8e6,
    hint: "About 132 million births a year. What share die before age 5? Think roughly 1 in 27.",
    why: "About 4.8 million in 2023 (UN IGME). Under-5 mortality is near 37 per 1,000 live births, and about half of these deaths are in sub-Saharan Africa." },
  { cat: "Health", q: "How many people die from malaria each year?", unit: "deaths per year", a: 6e5,
    hint: "About 250 million cases a year. What fraction might be fatal? Under 1 percent.",
    why: "WHO estimated about 263 million cases and about 597,000 deaths in 2023. About 95 percent were in Africa, mostly children under 5." },
  { cat: "Health", q: "How many people fall ill with tuberculosis each year?", unit: "new cases per year", a: 10.8e6,
    hint: "Roughly 1 in 750 people worldwide. India alone has about a quarter of all cases.",
    why: "WHO estimated 10.8 million new cases in 2023, about 130 per 100,000 people. TB is again the leading infectious killer." },
  { cat: "Health", q: "How many women die each year from pregnancy and childbirth complications?", unit: "deaths per year", a: 2.6e5,
    hint: "132 million births. Maternal mortality ratio worldwide is around 200 per 100,000 births.",
    why: "About 260,000 in 2023, a ratio near 197 per 100,000 live births. About 70 percent of these deaths are in sub-Saharan Africa." },
  { cat: "Health", q: "How many people worldwide are living with HIV?", unit: "people", a: 40e6,
    hint: "Global prevalence among all ages is about half of one percent. 8.1 billion people.",
    why: "About 40 million in 2023 (UNAIDS), with roughly 65 percent in sub-Saharan Africa. About 31 million were on treatment." },
  { cat: "Health", q: "How many children under 5 are stunted?", unit: "children", a: 148e6,
    hint: "About 660 million children under 5. Roughly one in five is too short for their age.",
    why: "About 148 million in 2022 (JME), around 22 percent. Most live in South Asia and sub-Saharan Africa." },
  { cat: "Health", q: "How many children got zero doses of any routine vaccine in 2023?", unit: "children", a: 14.5e6,
    hint: "About 130 million infants a year. Coverage for the first DTP dose is around 89 percent.",
    why: "WHO and UNICEF counted 14.5 million zero-dose children in 2023, about 11 percent of infants. More than half live in 10 countries." },
  { cat: "Health", q: "How many people lack safely managed drinking water?", unit: "people", a: 2.2e9,
    hint: "Safely managed means on premises, available when needed, and free of contamination. Roughly one in four people fail that test.",
    why: "About 2.2 billion in 2022 (WHO/UNICEF JMP), about 27 percent of the world. Most of the gap is rural." },
  { cat: "Health", q: "How many people lack safely managed sanitation?", unit: "people", a: 3.5e9,
    hint: "A private toilet whose waste is safely treated or disposed of. Roughly four in ten people do not have one.",
    why: "About 3.5 billion in 2022 (JMP), about 44 percent of the world." },
  { cat: "Health", q: "How many people still practice open defecation?", unit: "people", a: 4.2e8,
    hint: "Think South Asia and sub-Saharan Africa. The figure was over a billion in 2000.",
    why: "About 420 million in 2022 (JMP), down from about 1.3 billion in 2000. The largest numbers are in India, Ethiopia, Nigeria and Pakistan." },
  { cat: "Health", q: "How many children under 5 die from diarrhoea each year?", unit: "deaths per year", a: 4.4e5,
    hint: "Start from 4.8 million under-5 deaths. Diarrhoea is one of the top infectious causes. Maybe 1 in 10?",
    why: "WHO estimates about 440,000 child deaths a year from diarrhoeal disease, around 9 percent of under-5 deaths. Much of it is preventable with clean water, sanitation, vaccines and ORS." },
  { cat: "Health", q: "How large is the projected global health worker shortage by 2030?", unit: "workers", a: 11e6,
    hint: "Total health workforce is about 65 million. A shortage of 15 to 20 percent would be huge.",
    why: "WHO projects a shortfall of about 11 million by 2030, concentrated in low and lower-middle income countries, with the largest gaps in Africa and the Eastern Mediterranean." },

  /* Education */
  { cat: "Education", q: "How many children and youth are out of school worldwide?", unit: "children and youth", a: 272e6,
    hint: "Primary and secondary school ages, about 6 to 17. Roughly 1.6 billion people are in that age band. What share is out?",
    why: "UNESCO's GEM Report counted about 272 million out of school in 2025, about one in six of school age: 11 percent of primary-age, 15 percent of lower-secondary and 31 percent of upper-secondary-age children." },
  { cat: "Education", q: "How many adults worldwide cannot read or write a simple sentence?", unit: "adults", a: 754e6,
    hint: "About 5.5 billion adults. Literacy is around 87 percent. Two-thirds of those who cannot read are women.",
    why: "UNESCO counted about 754 million adults lacking basic literacy in 2022, roughly 14 percent." },
  { cat: "Education", q: "What percent of 10-year-olds in low and middle income countries cannot read and understand a simple story?", unit: "percent", a: 70,
    hint: "The World Bank calls this learning poverty. It rose after school closures. Pick a number between 50 and 90.",
    why: "About 70 percent in 2022, up from about 57 percent before COVID. In sub-Saharan Africa it is closer to 90 percent." },
  { cat: "Education", q: "How many additional teachers does the world need by 2030 to reach universal primary and secondary education?", unit: "teachers", a: 44e6,
    hint: "Think of about 1.4 billion school-age children and one teacher per 25 to 35 students, then subtract those already teaching.",
    why: "UNESCO estimates 44 million additional teachers are needed by 2030, about 15 million of them in sub-Saharan Africa." },
  { cat: "Education", q: "How many students are enrolled in higher education worldwide?", unit: "students", a: 254e6,
    hint: "About 640 million people are of university age. Roughly four in ten enroll.",
    why: "UNESCO counted about 254 million in 2021, up from about 100 million in 2000. Gross enrollment is near 40 percent." },

  /* Development and LMIC */
  { cat: "Development", q: "How many people live below the World Bank's $3 a day extreme poverty line?", unit: "people", a: 8e8,
    hint: "8.1 billion people. Roughly one in ten is below the line, and most live in sub-Saharan Africa.",
    why: "The World Bank estimated about 808 million in 2025, 9.9 percent of the world, after raising the line from $2.15 to $3 a day in June 2025. Other recent years run slightly higher or lower, and most of the poor live in sub-Saharan Africa." },
  { cat: "Development", q: "How much do migrants send home to low and middle income countries each year?", unit: "US dollars per year", a: 685e9,
    hint: "Roughly 200 million migrants. If each remits a few thousand dollars a year, what is the total?",
    why: "The World Bank put remittances to LMICs near $685 billion in 2024. India, Mexico, China and the Philippines are the biggest recipients." },
  { cat: "Development", q: "How much official development assistance did rich countries give in 2024?", unit: "US dollars per year", a: 212e9,
    hint: "The long-standing target is 0.7 percent of national income. Actual giving is about half of that. Rich-country income is around $65 trillion.",
    why: "OECD figures show about $212 billion in 2024, about 0.33 percent of donor income, down several percent from the year before." },
  { cat: "Development", q: "How many people live in sub-Saharan Africa?", unit: "people", a: 1.2e9,
    hint: "Africa overall has about 1.5 billion. North Africa is a small slice of that.",
    why: "About 1.2 billion. The region is projected to account for more than half of global population growth over the next few decades." },
  { cat: "Development", q: "How many adults in the world still have no bank or mobile money account?", unit: "adults", a: 1.3e9,
    hint: "Roughly 6 billion adults live on Earth. Nearly 80 percent now have an account.",
    why: "Nearly 80 percent of adults had an account in 2024, up from 50 percent in 2011. That leaves about 1.3 billion adults without one (World Bank, Global Findex 2025). In sub-Saharan Africa about 58 percent have an account.",
    src: [['World Bank, Global Findex 2025 press release', 'https://www.worldbank.org/en/news/press-release/2025/07/16/mobile-phone-technology-powers-saving-surge-in-developing-economies']] },
  { cat: "Development", q: "What is Ethiopia's GDP per person?", unit: "US dollars per year", a: 930,
    hint: "Sub-Saharan Africa averages about $1,600 a person and the US about $85,000. Ethiopia is among the poorer countries in the region.",
    why: "About $930 per person in 2025 in current US dollars (World Bank World Development Indicators). That is well below the regional average, and Ethiopia has more than 130 million people.",
    src: [['World Bank data via FRED, Ethiopia GDP per capita', 'https://fred.stlouisfed.org/series/PCAGDPETA646NWDB']] },
  { cat: "Development", q: "How many children does the average woman in Niger have over her lifetime?", unit: "children per woman", a: 5.9,
    hint: "The world average is a little over 2. Niger has one of the highest rates on Earth.",
    why: "About 5.9 births per woman in 2024 (World Bank), nearly three times the world average of a little over 2.",
    src: [['World Bank data via FRED, Niger fertility rate', 'https://fred.stlouisfed.org/series/SPDYNTFRTINNER']] },
  { cat: "Development", q: "How much did developing countries pay in debt service on their foreign debt in 2023?", unit: "US dollars", a: 1.4e12,
    hint: "Rich countries give about $212 billion a year in aid. Is debt repayment bigger or smaller than that, and by how many times?",
    why: "About $1.4 trillion, a record. Interest alone was $406 billion, a 20-year high (World Bank, International Debt Report 2024). The figure covers repayments of principal plus interest on external debt.",
    src: [['World Bank press release, December 2024', 'https://www.worldbank.org/en/news/press-release/2024/12/03/developing-countries-paid-record-1-4-trillion-on-foreign-debt-in-2023']] },
  { cat: "Development", q: "How much did the world's poorest countries pay in debt service in 2023?", unit: "US dollars", a: 96.2e9,
    hint: "These are the countries eligible for the World Bank's concessional lending, 78 in all. Compare with total aid of about $212 billion a year.",
    why: "A record $96.2 billion from the poorest, IDA-eligible countries (World Bank). That is about 45 percent of the $212 billion rich countries gave in aid in 2024. The years differ but the order of magnitude is the point.",
    src: [['World Bank press release, December 2024', 'https://www.worldbank.org/en/news/press-release/2024/12/03/developing-countries-paid-record-1-4-trillion-on-foreign-debt-in-2023']] },
  { cat: "Development", q: "How large is the World Bank's latest financing package for the world's poorest countries (IDA21)?", unit: "US dollars", a: 100e9,
    hint: "Donors put in a smaller amount and the Bank multiplies it by borrowing in markets. Annual aid from rich countries is about $212 billion.",
    why: "$100 billion in total financing after leveraging, built on $23.7 billion in donor pledges and supporting 78 countries. It was announced in December 2024.",
    src: [['World Bank press release, December 2024', 'https://www.worldbank.org/en/news/press-release/2024/12/05/donors-and-world-bank-group-boost-ida-development']] },
  { cat: "Development", q: "What share of the world's refugees live in low and middle income countries?", unit: "percent", a: 75,
    hint: "News coverage focuses on arrivals in Europe and North America. Think about who borders Syria, Afghanistan, Sudan and Ukraine.",
    why: "About 75 percent at the end of 2023. Low-income countries alone hosted about 16 to 17 percent (UNHCR, which gives both figures on the same page). Rich countries host the minority.",
    src: [['UNHCR, refugee hosting metrics', 'https://unhcr.org/refugee-statistics/insights/explainers/refugee-hosting-metrics.html']] },
  { cat: "Development", q: "What share of the UN's 2025 humanitarian appeal had been funded by the end of October?", unit: "percent", a: 23,
    hint: "The UN asked for about $45 billion. Think about how much of a request that large usually gets covered.",
    why: "About 23 percent: $10.6 billion of $45.4 billion in requirements at the end of October 2025 (UN OCHA Global Humanitarian Overview tracking).",
    src: [['UN OCHA, Global Humanitarian Overview 2025, October update', 'https://humanitarianaction.info/document/global-humanitarian-overview-2025-monthly-updates/article/october-update-0']] },
  { cat: "Development", q: "How many girls and women alive today were married before age 18?", unit: "girls and women", a: 640e6,
    hint: "About 4 billion women and girls are alive. Think about what share were married as children.",
    why: "UNICEF estimates about 640 million, down from an earlier estimate of about 650 million in 2019 (UNICEF, 2023 report).",
    src: [['Al Jazeera on the UNICEF 2023 report', 'https://www.aljazeera.com/news/2023/5/3/child-marriage-rate-falling-too-slowly-un-says-in-new-report'], ['UNICEF, 10 facts on child marriage', 'https://www.unicef.org/press-releases/fast-facts-10-facts-illustrating-why-we-must-endchildmarriage']] },
  { cat: "Development", q: "How many girls are married as children each year?", unit: "girls per year", a: 12e6,
    hint: "About 132 million babies are born a year, so roughly 65 million girls. What share marry before 18?",
    why: "About 12 million a year (UNICEF, 2023), roughly 1 in 5 girls. UNICEF says progress is too slow to end the practice by 2030.",
    src: [['Al Jazeera on the UNICEF 2023 report', 'https://www.aljazeera.com/news/2023/5/3/child-marriage-rate-falling-too-slowly-un-says-in-new-report']] },
  { cat: "Philanthropy", q: "How big is the Gates Foundation's annual budget for 2026?", unit: "US dollars per year", a: 9e9,
    hint: "US charities give about $592 billion a year in total. One very large foundation gives a small share of that.",
    why: "$9 billion for 2026, approved in January 2026 as part of a plan to close the foundation in 2045. For scale, that is roughly a fifth of the $50 billion of health aid in 2024, though the two cover different things.",
    src: [['Nonprofit Pro, Gates Foundation 2026 budget', 'https://www.nonprofitpro.com/article/gates-foundation-sets-historic-9b-budget-ahead-of-2045-wind-down']] },
  { cat: "Development", q: "How many people worldwide are forcibly displaced by conflict, persecution and violence?", unit: "people", a: 120e6,
    hint: "Includes refugees, asylum seekers and people displaced inside their own countries. Think of the big crises: Sudan, Syria, Ukraine, Afghanistan, DRC.",
    why: "UNHCR counted about 123 million at end 2024, roughly 1 in 67 people on Earth. About two thirds are displaced inside their own countries." },

  /* Philanthropy and grantmaking prep */
  { cat: "Philanthropy", q: "Roughly how much does it cost a top GiveWell-recommended charity to save one life?", unit: "US dollars", a: 5000,
    hint: "A bed net costs a few dollars. How many nets does it take to prevent one death? Then add delivery and overhead.",
    why: "GiveWell treats about $5,000 per life saved as a conservative average across its life-saving programs. Individual programs range from about $2,000 to $8,000 or more, and the marginal cost of the next grant is closer to $7,500 to $8,000. These are modeled estimates with real uncertainty." },
  { cat: "Philanthropy", q: "How much does it cost to buy and deliver one insecticide-treated bed net?", unit: "US dollars", a: 5,
    hint: "Manufacturing is a couple of dollars. Add shipping, distribution campaigns and follow-up checks.",
    why: "GiveWell estimated about $4.59 per net delivered by the Against Malaria Foundation (2020). A net lasts about three years." },
  { cat: "Philanthropy", q: "How much does it cost to protect one child with seasonal malaria chemoprevention for a year?", unit: "US dollars", a: 7,
    hint: "The drugs cost cents per dose, given monthly through the rainy season. Add community health worker delivery.",
    why: "GiveWell's grants have run from about $6 to $12 per child treated depending on country and year, and $6.80 in an earlier estimate for Malaria Consortium." },
  { cat: "Philanthropy", q: "How large is the standard GiveDirectly cash transfer per household?", unit: "US dollars", a: 1000,
    hint: "Big enough to buy a roof or livestock, small enough to reach many households. Think about a large share of one year of rural household income.",
    why: "About $1,000 per household in its standard program." },
  { cat: "Philanthropy", q: "How much did Americans give to charity in 2025?", unit: "US dollars", a: 617e9,
    hint: "US GDP is about $29 trillion. Americans give roughly 2 percent of it.",
    why: "Giving USA reported $617 billion for 2025, up about 3 percent after inflation. That is a little over 2 percent of GDP." },
  { cat: "Philanthropy", q: "What share of US charitable giving comes from individuals?", unit: "percent", a: 64,
    hint: "The rest comes from foundations, bequests and corporations. Think of individuals as roughly two thirds to four fifths.",
    why: "Individuals gave 64 percent of the dollars in 2025, down from 80 percent in 1985 (Giving USA). Foundation giving fell about 18 percent after inflation in 2025 after a near-record 2024.",
    src: [['AP report on Giving USA 2026 (WTOP)', "https://wtop.com/national/2026/06/donors-gave-u-s-charities-617-billion-in-2025-according-to-giving-usa-report/"]] },
  { cat: "Philanthropy", q: "How much did GiveWell commit in grants in 2025?", unit: "US dollars", a: 418e6,
    hint: "Think of GiveWell directing a few hundred million dollars a year. Coefficient Giving and many individual donors supply the money.",
    why: "$418 million in grants committed in 2025 (GiveWell, July 2026). GiveWell expects 2026 grantmaking to approach or even exceed $1 billion, and has already committed over $400 million so far this year.",
    src: [['GiveWell blog, Scaling Our Impact (July 2026)', 'https://blog.givewell.org/2026/07/23/scaling-our-impact-with-support/']] },
  { cat: "Philanthropy", q: "How much did Coefficient Giving direct in grants in 2025?", unit: "US dollars", a: 1.0e9,
    hint: "It is the largest funder in this space. Its giving grew by more than half in 2025. Think of a figure near a billion dollars.",
    why: "Over $1 billion in 2025, the most in its history, with total giving up more than 50 percent. Funding from donors other than Good Ventures more than doubled to over $200 million. The page gives only the 'over $1 billion' figure.",
    src: [['Coefficient Giving, 2025 results', 'https://coefficientgiving.org/?p=36736']] },
  { cat: "Philanthropy", q: "Early in 2026 GiveWell lowered its funding bar. How many times its cash benchmark must a program now beat?", unit: "times cash", a: 6,
    hint: "Cash transfers to people in extreme poverty are the yardstick. The bar was 8 times before the cut. Pick a number between 3 and 10.",
    why: "6 times, down from 8 times earlier in 2026. GiveWell estimates the change adds about $90 million in grants this year (GiveWell, July 2026). Programs are rated as a multiple of cash transfers: a program at 12 times cash means $100 to it does as much good as $1,200 in cash transfers.",
    src: [['GiveWell blog, Scaling Our Impact (July 2026)', 'https://blog.givewell.org/2026/07/23/scaling-our-impact-with-support/'], ['GiveWell blog, how cost-effectiveness is measured', 'https://blog.givewell.org/2023/10/27/how-we-work-1-cost-effectiveness/']] },
  { cat: "Development", q: "How much development assistance for health flowed to low and middle income countries in 2024?", unit: "US dollars", a: 50e9,
    hint: "It peaked during COVID near $80 billion. Then donors cut back. Where does it settle?",
    why: "IHME estimated about $49.6 billion in 2024, down from a peak of $80.3 billion in 2021. It then fell to about $39 billion in 2025 as the US, UK, France and Germany cut aid." },
  { cat: "Health", q: "How many excess deaths did COVID-19 cause worldwide across 2020 and 2021?", unit: "deaths", a: 14.9e6,
    hint: "Officially reported COVID deaths for those two years were about 5.4 million. Excess mortality is much higher than reported counts.",
    why: "WHO estimated about 14.9 million excess deaths, nearly three times the officially reported count." },
  { cat: "Earth", q: "How many land animals are slaughtered for food each year?", unit: "animals per year", a: 80e9,
    hint: "8.2 billion people. Chickens dominate. Think of a few chickens per person, plus pigs, cattle, sheep and ducks.",
    why: "About 80 billion a year, with chickens making up roughly 75 billion of them (FAO). Farmed fish would add a count in the hundreds of billions or more." },
  { cat: "AI", q: "How many floating-point operations were used to train GPT-4, by Epoch AI's estimate?", unit: "FLOP", a: 2e25,
    hint: "GPT-3 used about 3 x 10^23. Each generation has used roughly 10 to 100 times more.",
    why: "Epoch AI estimates about 2.1 x 10^25 FLOP, with low precision. By mid-2025 it counted over 30 publicly announced models above 10^25 FLOP." },
  { cat: "AI", q: "How much does one Nvidia H100 GPU cost to buy?", unit: "US dollars", a: 30000,
    hint: "A top gaming GPU is about $2,000 and a family car about $30,000. Data center chips sit well above gaming cards.",
    why: "Roughly $25,000 to $40,000 each depending on volume and year. A 10,000 chip cluster costs hundreds of millions of dollars before power and buildings." },
  { cat: "Health", q: "How many people did smallpox kill in the 20th century?", unit: "deaths", a: 300e6,
    hint: "It killed about 3 in 10 of those infected and circulated on every continent for most of the century.",
    why: "WHO attributes about 300 million deaths to smallpox in the 20th century. Eradication was certified in 1980, the only human infectious disease eradicated so far." },
  { cat: "Development", q: "How many children are in child labour worldwide?", unit: "children", a: 138e6,
    hint: "About 2.2 billion children exist. Think of the share aged 5 to 17 doing work that harms their health or schooling.",
    why: "ILO and UNICEF estimated 138 million in 2024, down from 160 million in 2020. About 60 percent work in agriculture." },
  { cat: "Development", q: "What is the average annual income per person in sub-Saharan Africa?", unit: "US dollars per year", a: 1600,
    hint: "The US is about $85,000 per person. Sub-Saharan Africa is poorer by a factor of 30 to 60.",
    why: "About $1,600 per person in 2023 at market exchange rates (World Bank), versus about $85,000 in the US, a gap of roughly 50 times." },
  { cat: "Everyday", q: "How many working hours are there in a typical career?", unit: "hours", a: 80000,
    hint: "About 40 years, 50 weeks a year, 40 hours a week.",
    why: "40 x 50 x 40 is 80,000 hours. It is the idea behind the career advice group 80,000 Hours." },

  /* Earth and the world */
  { cat: "Earth", q: "What is the circumference of the Earth?", unit: "km", a: 40075,
    hint: "The meter was first defined as one ten-millionth of the distance from the pole to the equator.",
    why: "About 40,000 km. That definition of the meter is why it comes out so round." },
  { cat: "Earth", q: "How far away is the Moon?", unit: "km", a: 384400,
    hint: "Light takes about 1.3 seconds to get there. Light travels 300,000 km every second.",
    why: "About 384,000 km on average. You could line up roughly 30 Earths in between." },
  { cat: "Earth", q: "How far is the Earth from the Sun?", unit: "km", a: 150e6,
    hint: "Sunlight takes about 8 minutes to arrive. That is 480 seconds at 300,000 km per second.",
    why: "About 150 million km, which is 1 astronomical unit." },
  { cat: "Earth", q: "How much water is in the world's oceans?", unit: "cubic km", a: 1.33e9,
    hint: "Earth's surface is 510 million square km, 71 percent of it ocean, with an average depth near 3.7 km.",
    why: "About 1.33 billion cubic km, roughly 97 percent of all the water on Earth." },
  { cat: "Earth", q: "How old is the Earth?", unit: "years", a: 4.5e9,
    hint: "Dinosaurs died out 66 million years ago. Life began more than 3.5 billion years ago.",
    why: "About 4.54 billion years." },
  { cat: "Earth", q: "What is the total land area of the Earth?", unit: "square km", a: 149e6,
    hint: "Earth's surface is 510 million square km. About 29 percent is land.",
    why: "About 149 million square km. Antarctica alone is about 14 million of that." },
  { cat: "Earth", q: "How many trees are on Earth?", unit: "trees", a: 3e12,
    hint: "A commonly cited ballpark is several hundred trees per person. 8 billion people.",
    why: "A 2015 study in Nature estimated about 3 trillion trees, roughly 400 per person." },
  { cat: "Earth", q: "How many humans have ever been born?", unit: "people", a: 110e9,
    hint: "A few million people 10,000 years ago, a billion by 1800, 8 billion now. Add up the generations and include childhood deaths.",
    why: "Estimates run from about 100 to 117 billion, so roughly 13 times today's population." },
  { cat: "Earth", q: "How much electricity does the world generate in a year?", unit: "TWh per year", a: 30000,
    hint: "8.2 billion people. Average use is about 3,600 kWh a person, from under 500 in low-income countries to over 12,000 in the US.",
    why: "About 30,000 TWh in 2023. Data centers take roughly 1.5 percent of it." },
  { cat: "Earth", q: "What is the size of the world economy (GDP)?", unit: "US dollars per year", a: 110e12,
    hint: "8.2 billion people. Average income is roughly $13,000 a person.",
    why: "About $110 trillion in 2024 at market exchange rates. The US is roughly a quarter of it, China about 17 percent." },
  { cat: "Earth", q: "How many cars, trucks and buses are on the road worldwide?", unit: "vehicles", a: 1.5e9,
    hint: "The US has about 280 million registered vehicles for 340 million people. Low-income countries have under 1 per 20 people.",
    why: "About 1.5 billion motor vehicles, roughly one for every five or six people." },
  { cat: "Earth", q: "How many people use the internet?", unit: "people", a: 6e9,
    hint: "About three quarters of the world is online. Those offline are concentrated in Africa and South Asia.",
    why: "ITU counted about 6 billion users in 2025, 74 percent of the world, up from 5.5 billion in 2024. About 2.2 billion remain offline." },
  { cat: "Earth", q: "How much food is wasted worldwide each year?", unit: "tonnes", a: 1.05e9,
    hint: "Think about 130 kg of food wasted per person per year. 8 billion people.",
    why: "UNEP estimated about 1.05 billion tonnes in 2022, with households responsible for about 60 percent of it." },
  { cat: "Earth", q: "How much plastic is produced worldwide each year?", unit: "tonnes", a: 4e8,
    hint: "Think about 50 kg per person per year. 8 billion people.",
    why: "About 400 million tonnes a year. Production has roughly doubled since 2000." },
  { cat: "Earth", q: "How much fresh water do humans withdraw each year?", unit: "cubic km per year", a: 4000,
    hint: "About 500 cubic meters a person, with roughly 70 percent going to agriculture. 1 cubic km is a billion cubic meters.",
    why: "About 4,000 cubic km a year (FAO). Farming takes about 70 percent of it." },
  { cat: "Earth", q: "How many people die worldwide each year?", unit: "deaths per year", a: 61e6,
    hint: "Population divided by lifespan gives about 110 million, but the population is young, so the real number is roughly half.",
    why: "About 61 million in 2023, well under the 132 million births because the population is young and growing." },
  { cat: "Earth", q: "What is the average life expectancy at birth worldwide?", unit: "years", a: 73,
    hint: "It ranges from under 55 in the worst-off countries to over 84 in Japan.",
    why: "About 73 years in 2023 (UN), up from about 47 in 1950." },

  /* AI and its potential impact */
  { cat: "AI", q: "How much electricity will data centers worldwide use in 2030, by the IEA's base case?", unit: "TWh per year", a: 945,
    hint: "They used about 415 TWh in 2024. The IEA expects demand to more than double, driven mostly by AI.",
    why: "About 945 TWh, slightly more than all of Japan uses today. AI-optimised data centers are projected to more than quadruple their demand. Even so, data centers make up only about a tenth of global electricity demand growth to 2030." },
  { cat: "AI", q: "How many times cheaper did it become to run GPT-3.5-level AI between late 2022 and late 2024?", unit: "times cheaper", a: 280,
    hint: "The price fell from about $20 per million tokens to a few cents. Divide the old price by the new one.",
    why: "From about $20 to $0.07 per million tokens, a 280-fold drop in roughly 18 months (Stanford AI Index 2025). At a fixed capability level, prices have fallen anywhere from 9 to 900 times a year depending on the task." },
  { cat: "AI", q: "What share of jobs worldwide is exposed to AI, by the IMF's estimate?", unit: "percent", a: 40,

/* ---------- Calculator ---------- */
function evalExpr(src) {
  const s = String(src).toLowerCase().replace(/,/g, "");
  const suff = { thousand: 1e3, million: 1e6, billion: 1e9, trillion: 1e12, mil: 1e6, bn: 1e9, tn: 1e12, k: 1e3, m: 1e6, b: 1e9, t: 1e12 };
  const toks = [];
  let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    const m = s.slice(i).match(/^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/);
    if (m) {
      let v = parseFloat(m[0]);
      i += m[0].length;
      const sm = s.slice(i).match(/^\s*(thousand|million|billion|trillion|mil|bn|tn|k|m|b|t)(?![a-z])/);
      if (sm) { v *= suff[sm[1]]; i += sm[0].length; }
      toks.push({ t: "n", v: v });
      continue;
    }
    if (c === "x" || c === "\u00d7" || c === "*" || c === "\u00b7") { toks.push({ t: "*" }); i++; continue; }
    if (c === "\u00f7" || c === "/") { toks.push({ t: "/" }); i++; continue; }
    if (c === "\u2212" || c === "\u2013" || c === "-") { toks.push({ t: "-" }); i++; continue; }
    if ("+^()%".indexOf(c) >= 0) { toks.push({ t: c }); i++; continue; }
    return NaN;
  }
  if (!toks.length) return NaN;
  let p = 0;
  const peek = () => (toks[p] ? toks[p].t : null);
  function expr() { let v = term(); while (peek() === "+" || peek() === "-") { const o = toks[p++].t; const r = term(); v = o === "+" ? v + r : v - r; } return v; }
  function term() { let v = unary(); while (peek() === "*" || peek() === "/") { const o = toks[p++].t; const r = unary(); v = o === "*" ? v * r : v / r; } return v; }
  function unary() { if (peek() === "-") { p++; return -unary(); } if (peek() === "+") { p++; return unary(); } return pow(); }
  function pow() { const b = post(); if (peek() === "^") { p++; const e = unary(); return Math.pow(b, e); } return b; }
  function post() { let v = prim(); while (peek() === "%") { p++; v /= 100; } return v; }
  function prim() {
    const t = toks[p];
    if (!t) throw new Error("end");
    if (t.t === "n") { p++; return t.v; }
    if (t.t === "(") {
      p++;
      const v = expr();
      if (peek() === ")") p++;
      else if (p < toks.length) throw new Error("paren");
      return v;
    }
    throw new Error("bad");
  }
  try {
    const v = expr();
    if (p < toks.length) return NaN;
    return isFinite(v) ? v : NaN;
  } catch (e) { return NaN; }
}

/* ---------- Formatting ---------- */
function sig(x) { return parseFloat(x.toPrecision(3)); }
function sci(n) { const e = Math.floor(Math.log10(n)); return sig(n / Math.pow(10, e)) + " x 10^" + e; }
function fmt(n) {
  if (n >= 1e15) return sci(n);
  if (n >= 1e12) return sig(n / 1e12) + " trillion";
  if (n >= 1e9) return sig(n / 1e9) + " billion";
  if (n >= 1e6) return sig(n / 1e6) + " million";
  if (n >= 1000) return Math.round(n).toLocaleString("en-US");
  return String(sig(n));
}
function fmtFull(n) {
  if (n >= 1e6 && n < 1e15) return fmt(n) + "  (" + Math.round(n).toLocaleString("en-US") + ")";
  return fmt(n);
}
function short(n) {
  if (n >= 1e15) return "10^" + Math.round(Math.log10(n));
  if (n >= 1e12) return (n / 1e12) + "T";
  if (n >= 1e9) return (n / 1e9) + "B";
  if (n >= 1e6) return (n / 1e6) + "M";
  if (n >= 1e3) return (n / 1e3) + "K";
  return String(n);
}
function ratioText(guess, ans) {
  const r = guess / ans;
  const f = r >= 1 ? r : 1 / r;
  if (Math.abs(Math.log10(r)) < 0.03) return "within 7 percent";
  const num = f < 10 ? f.toFixed(1) : Math.round(f).toLocaleString("en-US");
  return num + "x too " + (r >= 1 ? "high" : "low");
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function buildDeck(n) {
  const p = pool(cat);
  const missed = shuffle(p.filter(q => seen[q.id]));
  const fresh = shuffle(p.filter(q => !seen[q.id]));
  const takeM = Math.min(missed.length, Math.ceil(n * 0.4));
  let deck = missed.slice(0, takeM).concat(fresh.slice(0, n - takeM));
  if (deck.length < n) deck = deck.concat(missed.slice(takeM, takeM + (n - deck.length)));
  return shuffle(deck).slice(0, n);
}

function start(n) {
  const deck = buildDeck(n);
  state = { mode: "std", deck: deck, i: 0, total: 0, results: [], phase: "ask", hint: false, cleared: 0 };

}

function submit() {
  const item = state.deck[state.i];
  const guess = evalExpr(document.getElementById("g").value);
  const err = document.getElementById("err");
  if (!isFinite(guess) || guess <= 0) {
    err.textContent = "Enter a positive number or a calculation, like 50 x 5 x 6.";
    return;
  }
  let range = null;
  if (!item.lo) {
    const ra = document.getElementById("rlo").value.trim(), rb = document.getElementById("rhi").value.trim();
    if (ra || rb) {
      const lo = evalExpr(ra), hi = evalExpr(rb);
      if (!ra || !rb || !isFinite(lo) || !isFinite(hi) || lo <= 0 || hi <= 0) { err.textContent = "Fill in both ends of your range, or clear both to skip it."; return; }
      if (lo > hi) { err.textContent = "Your low is above your high. Swap them."; return; }
      if (guess < lo || guess > hi) { err.textContent = "Your estimate should sit inside your own range."; return; }
      range = { lo: lo, hi: hi, hit: item.a >= lo && item.a <= hi };
    }
  }
  let e, tier;
  if (item.lo) {
    e = guess < item.lo ? Math.log10(item.lo / guess) : (guess > item.hi ? Math.log10(guess / item.hi) : 0);
    tier = SC_TIERS.find(t => e <= t.max);
  } else {
    e = Math.abs(Math.log10(guess / item.a));
    tier = TIERS.find(t => e <= t.max);
  }
  let pts = tier.pts;
  if (state.hint) pts = Math.round(pts * 0.75);
  const cleared = (item.lo ? e === 0 : e <= CLEAR_ERR) && !state.hint;
  seen[item.id] = true; saveSeen();
  if (cleared) { mastered.add(item.id); saveMastered(); state.cleared++; }
  if (!item.lo) {
    log.push({ c: item.cat, s: +Math.log10(guess / item.a).toFixed(3), e: +e.toFixed(3), h: range ? (range.hit ? 1 : 0) : null, w: range ? +Math.log10(range.hi / range.lo).toFixed(2) : null });
    saveLog();
  }
  state.total += pts;
  state.results.push({ q: item.q, guess: guess, ans: item.a, err: e, signed: Math.log10(guess / item.a), pts: pts, cleared: cleared, range: range });
  state.phase = "result";
  renderResult(item, guess, e, tier, pts, cleared, range);
}

function numberLine(guess, ans, range) {
  const lg = Math.log10(guess), la = Math.log10(ans);
  const rl = range ? Math.log10(range.lo) : lg, rh = range ? Math.log10(range.hi) : lg;
  let lo = Math.floor(Math.min(lg, la, rl)) - 1;
  let hi = Math.ceil(Math.max(lg, la, rh)) + 1;
  if (hi - lo < 4) { lo -= 1; hi += 1; }
  const pos = v => ((v - lo) / (hi - lo)) * 100;
  const step = (hi - lo) > 8 ? 2 : 1;
  let ticks = "";
  for (let k = lo; k <= hi; k += step) {
    const p = pos(k);
    ticks += `<div class="tick" style="left:${p}%"></div><div class="tl" style="left:${p}%">${k < 0 ? "10^" + k : short(Math.pow(10, k))}</div>`;
  }
  const py = pos(lg), pt = pos(la);
  const band = range ? '<div class="band" style="left:' + pos(rl) + '%;width:' + Math.max(0.8, pos(rh) - pos(rl)) + '%"></div>' : "";
  const clampL = p => Math.min(92, Math.max(8, p));
  return `
    <div class="nl" aria-label="Log scale showing your guess, your range if you set one, and the answer">
      <div class="axis"></div>
      ${band}
      ${ticks}
      <div class="stem y" style="left:${py}%"></div>
      <div class="stem t" style="left:${pt}%"></div>
      <div class="dot y" style="left:${py}%"></div>
      <div class="dot t" style="left:${pt}%"></div>
      <div class="mk y" style="left:${clampL(py)}%">You</div>
      <div class="mk t" style="left:${clampL(pt)}%">Answer</div>
    </div>`;
}

function renderResult(item, guess, e, tier, pts, cleared, range) {
  const last = state.i === state.deck.length - 1;
  const hintNote = state.hint ? " (hint used, 25% off)" : "";
  let clearNote = "";
  const rangeNote = range ? rangeNoteHtml(range) : "";
  if (cleared) clearNote = `<div class="cleared" id="clearedNote">Cleared. You will not see this one again.</div><button type="button" class="linkbtn" id="keepBtn" style="display:block;margin:-6px 0 14px">I guessed. Keep it in my deck.</button>`;
  else if (e <= CLEAR_ERR && state.hint) clearNote = `<div class="pts" style="margin-top:-8px">Close enough, but a hint was used. It stays in the deck.</div>`;
  app.innerHTML = `
    ${topbar()}
    <div class="card">
      <div class="verdict display ${tier.cls}">${tier.label}</div>
      <div class="pts">+${pts} points${hintNote}</div>
      ${clearNote}
      ${numberLine(guess, item.a, range)}
      <div class="kv">
        <span class="k">Your estimate</span><span class="v y">${fmt(guess)}</span>
        <span class="k">${item.lo ? "Plausible range" : "Reference answer"}</span><span class="v t">${item.lo ? fmt(item.lo) + " to " + fmt(item.hi) : fmt(item.a)}</span>
        ${item.lo ? '<span class="k">Worked example lands at</span><span class="v">' + fmt(item.a) + '</span>' : ''}
        <span class="k">Miss</span><span class="v">${item.lo ? (e === 0 ? "inside the range" : ratioText(guess, guess > item.hi ? item.hi : item.lo) + " than the range") : ratioText(guess, item.a)}</span>
        ${range ? '<span class="k">Your 80% range</span><span class="v y">' + fmt(range.lo) + ' to ' + fmt(range.hi) + '</span><span class="k">Range result</span><span class="v ' + (range.hit ? 'good' : 'bad') + '">' + rangeResultText(range, item.a) + '</span>' : ''}
      </div>
      ${rangeNote}
      <div class="why">${item.lo ? '<b>One reasonable chain of reasoning</b><ol class="steps">' + item.steps.map(t => '<li>' + t + '</li>').join('') + '</ol>' : ''}${item.why}${srcHtml(item)}<small>${item.lo ? 'This is a scenario, not a measured fact. Inputs marked as assumptions are for the exercise, and the range reflects reasonable variation in them.' : 'Figures are rounded and publishers revise them. Open the sources to check the exact number.'}</small></div>
      <div class="row"><button id="next" type="button" class="primary">${last ? "See results" : "Next question"}</button></div>
    </div>`;
  const nb = document.getElementById("next");
  nb.focus({ preventScroll: true });
  nb.addEventListener("click", () => {
    if (last) renderEnd(); else { state.i++; renderQuestion(); }
  });
  const kb = document.getElementById("keepBtn");
  if (kb) kb.addEventListener("click", () => {
    const r = state.results[state.results.length - 1];
    const note = document.getElementById("clearedNote");
    if (r.cleared) {
      mastered.delete(item.id); saveMastered(); state.cleared--; r.cleared = false;
      note.textContent = "Kept in your deck. You will see it again.";
      note.style.color = "var(--muted)"; note.style.borderColor = "var(--muted)";
      kb.textContent = "Clear it after all";
    } else {
      mastered.add(item.id); saveMastered(); state.cleared++; r.cleared = true;
      note.textContent = "Cleared. You will not see this one again.";
      note.style.color = ""; note.style.borderColor = "";
      kb.textContent = "I guessed. Keep it in my deck.";
    }
  });
}

function renderEnd() {
  const n = state.results.length;
  const maxPts = n * 100;
  const avgPts = state.total / n;
  const avgErr = state.results.reduce((s, r) => s + r.err, 0) / n;
  const bias = state.results.reduce((s, r) => s + r.signed, 0) / n;
  const best = getBest();
  const newBest = avgPts > best;
  if (newBest) setBest(avgPts);
  const within2 = state.results.filter(r => r.err <= CLEAR_ERR).length;
  const left = pool(cat).length;

  let rank;
  if (avgPts >= 80) rank = "Fermi-grade";
  else if (avgPts >= 60) rank = "Reliable estimator";
  else if (avgPts >= 40) rank = "Getting calibrated";
  else if (avgPts >= 20) rank = "Needs more reps";
  else rank = "Warm-up round";

  const rr = state.results.filter(r => r.range);
  const rangeLine = rr.length ? `<p style="margin:0 0 6px">Ranges: you hit ${rr.filter(r => r.range.hit).length} of ${rr.length}. The target is about 8 in 10.</p>` : "";
  let biasText;
  if (Math.abs(bias) < 0.1) biasText = "No clear lean. Your misses balance out.";
  else {
    const f = Math.pow(10, Math.abs(bias));
    biasText = `You run ${bias > 0 ? "high" : "low"} by about ${f.toFixed(1)}x on average. Adjust your gut accordingly.`;
  }

  app.innerHTML = `
    <div class="card">
      <div class="pts" style="margin:0">${rank}</div>
      <div class="big display">${state.total}<span style="font-size:22px;color:var(--muted);font-weight:600"> / ${maxPts}</span></div>
      ${newBest ? '<p class="good" style="margin:8px 0 0;font-weight:700">New best average.</p>' : ""}
      <div class="stats">
        <div class="stat"><b>${state.cleared} cleared</b><span>${left} left in ${cat === "All" ? "all topics" : cat}</span></div>
        <div class="stat"><b>${Math.pow(10, avgErr).toFixed(1)}x</b><span>typical miss</span></div>
      </div>
      <p style="margin:0 0 6px">${biasText}</p>
      ${rangeLine}
      <ul class="hist">
        ${state.results.map(r => `<li><span>${r.q}</span><b class="${r.pts >= 70 ? "good" : r.pts >= 20 ? "mid" : "bad"}">${r.pts}${r.cleared ? " cleared" : ""}</b></li>`).join("")}
      </ul>
      <div class="row" style="margin-top:18px">
        <button id="again" type="button" class="primary">${left ? "Next round" : "Back to topics"}</button>
        <button id="home" type="button">Change topic</button>
      </div>
    </div>`;
  document.getElementById("again").addEventListener("click", () => {
    if (left) start(Math.min(n, left)); else renderIntro();
  });
  document.getElementById("home").addEventListener("click", renderIntro);
}

/* ---------- Shared input helpers ---------- */
let activeNum = null;
let onNumInput = function () {};
let onEnter = function () {};
let confirmStats = false;
let drows = [];

function isTouch() { return !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches); }
function IM() { return isTouch() ? "none" : "text"; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }
function spanText(r) { return (r < 10 ? r.toFixed(1) : Math.round(r).toLocaleString("en-US")) + "x"; }
function keypadHtml() {
  return '<div class="keypad" id="keypad">' + KEYS.map(k => '<button type="button" class="key ' + k[1] + '" data-k="' + k[0] + '" aria-label="' + k[0] + '">' + k[0] + '</button>').join("") + '</div>';
}
function kbToggleHtml() { return isTouch() ? '<button type="button" class="kbtoggle" id="kbt">Use my device keyboard instead</button>' : ""; }
function livePreview(raw0, preview, unit) {
  const raw = raw0.trim();
  if (!raw) { preview.className = "preview muted"; preview.textContent = "Your answer shows here as you type"; return; }
  const v = evalExpr(raw);
  if (isFinite(v) && v > 0) { preview.className = "preview"; preview.innerHTML = "= " + fmtFull(v) + ' <span class="u">' + unit + "</span>"; }
  else if (isFinite(v)) { preview.className = "preview muted"; preview.textContent = "Needs to be above zero"; }
  else {
    const t = raw.replace(/[+\-*\/^\u00d7\u00f7\u2212x(\s]+$/i, "");
    const w = t ? evalExpr(t) : NaN;
    preview.className = "preview muted";
    preview.textContent = (isFinite(w) && w > 0) ? "So far: " + fmtFull(w) : "Keep typing";
  }
}
function wireKeypad() {
  const kp = document.getElementById("keypad");
  kp.addEventListener("mousedown", e => e.preventDefault());
  kp.querySelectorAll(".key").forEach(b => b.addEventListener("click", () => {
    const input = (activeNum && document.body.contains(activeNum)) ? activeNum : document.querySelector(".numin");
    if (!input) return;
    activeNum = input;
    const k = b.dataset.k;
    const st = input.selectionStart == null ? input.value.length : input.selectionStart;
    const en = input.selectionEnd == null ? input.value.length : input.selectionEnd;
    if (k === "C") { input.value = ""; }
    else if (k === "\u232b") {
      if (st !== en) { input.setRangeText("", st, en, "end"); }
      else if (st > 0) { input.setRangeText("", st - 1, st, "end"); }
    } else {
      const ins = k === "M" ? "m" : k === "B" ? "b" : k;
      input.setRangeText(ins, st, en, "end");
    }
    onNumInput(input);
  }));
}
function wireKbToggle() {
  const kbt = document.getElementById("kbt");
  if (!kbt) return;
  kbt.addEventListener("click", () => {
    const els = Array.from(document.querySelectorAll(".numin"));
    if (!els.length) return;
    const on = els[0].getAttribute("inputmode") === "none";
    const keepId = (activeNum && document.body.contains(activeNum)) ? activeNum.id : els[0].id;
    /* Swap in fresh inputs so the phone re-reads inputmode and opens the right keyboard */
    els.forEach(el => {
      const fresh = el.cloneNode(false);
      fresh.value = el.value;
      fresh.setAttribute("inputmode", on ? "text" : "none");
      el.replaceWith(fresh);
    });
    activeNum = document.getElementById(keepId);
    kbt.textContent = on ? "Use the built-in keypad only" : "Use my device keyboard instead";
    activeNum.focus();
    try { const l = activeNum.value.length; activeNum.setSelectionRange(l, l); } catch (e) {}
  });
}
app.addEventListener("focusin", e => { if (e.target.classList && e.target.classList.contains("numin")) activeNum = e.target; });
app.addEventListener("input", e => { if (e.target.classList && e.target.classList.contains("numin")) onNumInput(e.target); });
app.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList && e.target.classList.contains("numin")) onEnter(); });

/* ---------- Range feedback ---------- */
function rangeResultText(r, a) {
  if (r.hit) return "Hit, " + spanText(r.hi / r.lo) + " wide";
  const f = a > r.hi ? a / r.hi : r.lo / a;
  return "Missed, answer " + (f < 10 ? f.toFixed(1) : Math.round(f).toLocaleString("en-US")) + "x " + (a > r.hi ? "above" : "below") + " your range";
}
function rangeNoteHtml(r) {
  const span = r.hi / r.lo;
  let t = "";
  if (!r.hit && span < 3) t = "A narrow range that missed is the classic overconfidence pattern. Widen your next one.";
  else if (r.hit && span >= 100) t = "That range spans 100x or more. It is easy to hit and says very little. Try tightening it.";
  else if (!r.hit) t = "Missed. A few misses are healthy: you want to hit about 8 in 10, not all of them.";
  return t ? '<p class="note" style="margin:-4px 0 12px">' + t + "</p>" : "";
}

/* ---------- Stats ---------- */
function renderStats() {
  const rs = log.filter(x => x.h === 0 || x.h === 1);
  const n = rs.length, hits = rs.filter(x => x.h === 1).length;
  let cal;
  if (n === 0) {
    cal = '<p class="note" style="margin-top:6px">No ranges yet. On any fact question, fill in an 80% range before you lock in. After 10 you get a reading.</p>';
  } else {
    const rate = hits / n;
    let verdict, cls;
    if (n < 10) { verdict = "Log " + (10 - n) + " more " + (10 - n === 1 ? "range" : "ranges") + " for a reliable reading."; cls = "mid"; }
    else if (rate < 0.65) { verdict = "Overconfident. Your ranges are too tight. Widen them until you hit about 8 in 10."; cls = "bad"; }
    else if (rate > 0.92) { verdict = "Too cautious. Your ranges are wider than they need to be. Tighten them."; cls = "mid"; }
    else { verdict = "Well calibrated. Keep your ranges honest."; cls = "good"; }
    const widths = rs.filter(x => isFinite(x.w));
    const avgW = widths.length ? Math.pow(10, widths.reduce((s, x) => s + x.w, 0) / widths.length) : null;
    const blocks = [];
    for (let i = 0; i + 10 <= n; i += 10) blocks.push(rs.slice(i, i + 10).filter(x => x.h === 1).length / 10);
    const shown = blocks.slice(-8);
    const trend = shown.length ? `<div class="trend" role="img" aria-label="Hit rate for each block of 10 ranges, with the 80 percent target line"><div class="tgt"><span>80% target</span></div>${shown.map(r => `<i title="${Math.round(r * 100)}%" style="height:${Math.max(2, Math.round(r * 100))}%;background:${r >= 0.7 && r <= 0.9 ? "var(--good)" : "var(--mid)"}"></i>`).join("")}</div><p class="note" style="margin:0 0 8px">Each bar is a block of 10 ranges, oldest on the left.</p>` : "";
    cal = `
      <div class="stats">
        <div class="stat"><b>${Math.round(rate * 100)}%</b><span>hit rate, ${hits} of ${n}</span></div>
        <div class="stat"><b>${avgW ? spanText(avgW) : "n/a"}</b><span>typical range width</span></div>
      </div>
      <p class="${cls}" style="margin:0 0 4px;font-weight:700">${verdict}</p>
      ${trend}`;
  }
  const rows = CATS.filter(c => c !== "All").map(c => {
    const L = log.filter(x => x.c === c);
    if (L.length < 3) return { c: c, n: L.length };
    return { c: c, n: L.length, s: L.reduce((a, x) => a + x.s, 0) / L.length, e: L.reduce((a, x) => a + x.e, 0) / L.length };
  });
  const biasHtml = rows.map(r => {
    if (r.s === undefined) return `<div class="brow"><div class="top"><span>${r.c} <small>${r.n} answered</small></span><small>needs ${3 - r.n} more</small></div></div>`;
    const flat = Math.abs(r.s) < 0.1;
    const pct = Math.min(50, Math.abs(r.s) * 50);
    const txt = flat ? "balanced" : (r.s > 0 ? "runs high " : "runs low ") + Math.pow(10, Math.abs(r.s)).toFixed(1) + "x";
    const bar = flat ? "" : `<i style="left:${r.s >= 0 ? 50 : 50 - pct}%;width:${pct}%;background:${r.s > 0 ? "var(--truth)" : "var(--you)"}"></i>`;
    return `<div class="brow"><div class="top"><span>${r.c} <small>${r.n} answered</small></span><b>${txt}</b></div><div class="bias" role="img" aria-label="${r.c}: ${txt}"><div class="mid"></div>${bar}</div><small>typical miss ${Math.pow(10, r.e).toFixed(1)}x</small></div>`;
  }).join("");
  const dec = decomp.n ? `<p style="margin:6px 0 0">Building from pieces beat your gut on <b>${decomp.better} of ${decomp.n}</b> questions (${Math.round(decomp.better / decomp.n * 100)}%).</p>` : '<p class="note" style="margin-top:6px">No decompose rounds yet. Start one from the home screen.</p>';
  const masteryHtml = CATS.filter(c => c !== "All").map(c => {
    const p = catProgress(c), L = log.filter(x => x.c === c);
    const miss = L.length >= 3 ? "typical miss " + Math.pow(10, L.reduce((a, x) => a + x.e, 0) / L.length).toFixed(1) + "x" : "typical miss needs " + (3 - L.length) + " more answers";
    const flag = p.touched === 0 ? '<b class="bad">Untouched</b>' : "<b>" + p.cleared + " of " + p.total + " cleared</b>";
    return `<div class="brow"><div class="top"><span>${c}</span>${flag}</div><div class="prog" role="img" aria-label="${c}: ${p.cleared} of ${p.total} cleared"><i style="width:${Math.round(p.frac * 100)}%"></i></div><small>${miss}</small></div>`;
  }).join("");
  const fl = flawStats.n ? `<p style="margin:6px 0 0">You spotted the flawed input in <b>${flawStats.found} of ${flawStats.n}</b> (${Math.round(flawStats.found / flawStats.n * 100)}%).</p>` + Object.keys(flawStats.types).map(k => `<div class="brow"><div class="top"><span>${k}</span><b>${flawStats.types[k].found} of ${flawStats.types[k].n}</b></div></div>`).join("") : '<p class="note" style="margin-top:6px">No Find the flaw rounds yet. Start one from the home screen.</p>';
  const any = log.length || decomp.n || flawStats.n;
  app.innerHTML = `
    <div class="card">
      <h2 class="display" style="font-size:26px;font-weight:800;margin-bottom:2px">Your stats</h2>
      <p class="note" style="margin-top:0">Saved on this device and browser only. Calibration covers fact questions only.</p>
      <h3 class="sec display">Topic mastery</h3>
      <p class="note" style="margin:0 0 4px">Cleared questions per topic.</p>
      ${masteryHtml}
      <h3 class="sec display">Calibration</h3>
      ${cal}
      <h3 class="sec display">Bias by topic</h3>
      <p class="note" style="margin:0 0 6px">Runs low means your guesses sit below the truth on average. Bars point left for low, right for high. One full side is 10x.</p>
      ${biasHtml}
      <h3 class="sec display">Decompose</h3>
      ${dec}
      <h3 class="sec display">Find the flaw</h3>
      ${fl}
      ${transferHtml()}
      <div class="row" style="margin-top:18px"><button id="statsBack" type="button" class="primary">Back</button></div>
      ${any ? `<button class="linkbtn" id="statsReset">${confirmStats ? "Tap again to erase all stats" : "Reset stats"}</button>` : ""}
    </div>`;
  document.getElementById("statsBack").addEventListener("click", () => { xfer = ""; xferMsg = ""; xferConfirm = false; renderIntro(); });
  wireTransfer();
  const rb = document.getElementById("statsReset");
  if (rb) rb.addEventListener("click", () => {
    if (!confirmStats) { confirmStats = true; renderStats(); return; }
    log = []; saveLog(); decomp = { n: 0, better: 0 }; saveDecomp(); flawStats = { n: 0, found: 0, types: {}, done: {} }; saveFlaw(); confirmStats = false; renderStats();
  });
}

/* ---------- Decompose mode ---------- */
function startDecomp() {
  const p = shuffle(pool(cat).filter(q => q.split)).slice(0, 5);
  if (!p.length) return;
  state = { mode: "decomp", deck: p, i: 0, total: 0, results: [], phase: "gut", hint: false, cleared: 0, better: 0, gut: null };
  renderGut();
}

function renderGut() {
  const item = state.deck[state.i];
  state.phase = "gut";
  app.innerHTML = `
    ${topbar()}
    <div class="card">
      <div class="pts" style="margin:0 0 4px">Step 1 of 2: gut check</div>
      <div class="q display">${item.q}</div>
      <div class="unit">Answer in ${item.unit}</div>
      <label class="lab" for="g">Your gut estimate, before any math</label>
      <input class="numin" id="g" type="text" inputmode="${IM()}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g. 5 million">
      <div class="preview" id="preview" aria-live="polite"></div>
      <div class="err" id="err" role="alert"></div>
      <div class="row"><button id="go" type="button" class="primary">Lock in gut, then build it</button></div>
      ${keypadHtml()}
      ${kbToggleHtml()}
    </div>`;
  const preview = document.getElementById("preview");
  const err = document.getElementById("err");
  onNumInput = () => { err.textContent = ""; livePreview(document.getElementById("g").value, preview, item.unit); };
  function lock() {
    const v = evalExpr(document.getElementById("g").value);
    if (!isFinite(v) || v <= 0) { err.textContent = "Enter a positive number first."; return; }

function syncRows() {
  drows.forEach((r, i) => {
    const v = document.getElementById("v" + i);

}
function pieceVal(r) {

}

  let tot = null, ok = true, used = 0;
  drows.forEach(r => {
    const raw = r.v.trim();
    if (!raw) return;
    const x = pieceVal(r);
    if (!isFinite(x) || x <= 0 || (r.pct && x > 1)) { ok = false; return; }

function renderDecompResult(built) {
  const item = state.deck[state.i], gut = state.gut;

  const last = state.i === state.deck.length - 1;
  const verdict = better ? ["Building it beat your gut", "good"] : worse ? ["Your gut beat your build", "mid"] : ["Gut and build tied", "mid"];
  const msg = better
    ? "Splitting the question shrank your error. That is the habit to keep."

  const stepsHtml = pe.map(p => "<li>" + esc(p.r.l) + ": you said <b>" + pieceFmt(p.r, p.y) + "</b>, reference <b>" + pieceFmt(p.r, p.r.ref) + "</b> (" + ratioText(p.y, p.r.ref) + ")" + (p === worst && p.e >= 0.1 ? " <b>\u2190 biggest miss</b>" : "") + "</li>").join("");
  app.innerHTML = `
    ${topbar()}
    <div class="card">
      <div class="verdict display ${verdict[1]}">${verdict[0]}</div>
      <div class="pts">${msg}</div>
      <div class="cmp">
        <div class="cmprow"><span>Gut</span><div class="cbar"><i style="width:${w(eg)}%;background:var(--muted)"></i></div><b>${ratioText(gut, item.a)}</b></div>
        <div class="cmprow"><span>Built</span><div class="cbar"><i style="width:${w(eb)}%;background:var(--you)"></i></div><b>${ratioText(built, item.a)}</b></div>
      </div>
      <div class="kv">
        <span class="k">Your gut</span><span class="v">${fmt(gut)}</span>
        <span class="k">Your build</span><span class="v y">${fmt(built)}</span>
        <span class="k">Reference answer</span><span class="v t">${fmt(item.a)}</span>
      </div>
      <div class="why"><b>Your pieces against the references</b><ol class="steps">${stepsHtml}</ol>
        ${item.why}${srcHtml(item)}<small>Figures are rounded and publishers revise them. Open the sources to check the exact number.</small></div>
      <div class="row"><button id="next" type="button" class="primary">${last ? "See results" : "Next question"}</button></div>
    </div>`;
  const nb = document.getElementById("next");

  nb.addEventListener("click", () => {
    if (last) renderDecompEnd(); else { state.i++; state.gut = null; renderGut(); }
  });
}
